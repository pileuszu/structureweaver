[package]
name = "structureweaver"
version = "0.1.0"
edition = "2024"
description = "Local document structure analysis and ERD design with Rust and Llama"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
calamine = { version = "0.31", features = ["dates"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
fontdue = "0.9"
ttf-parser = "0.25"
eframe = { version = "0.31", default-features = false, features = ["accesskit", "default_fonts", "glow", "x11", "wayland"] }
rfd = "0.15"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
